apiVersion: apps/v1
kind: Deployment
metadata:
  name: resend-mailer
  namespace: mailapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: resend-mailer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resend-mailer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: resend-mailer
          image: ghcr.io/mailapi/resend-mailer:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: resend-mailer-config
            - secretRef:
                name: resend-mailer-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
